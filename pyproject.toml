[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isoforest"
version = "0.1.0"
description = "Isolation Forest and Extended Isolation Forest from scratch in NumPy, with per-feature explanations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.0"]

[project.scripts]
isoforest = "isoforest.cli:main"

[tool.setuptools]
packages = ["isoforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
